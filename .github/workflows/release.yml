name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_name: ai-igniter-x86_64-unknown-linux-musl.tar.gz
            binary_name: ai-igniter
            install_musl: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: ai-igniter-x86_64-unknown-linux-gnu.tar.gz
            binary_name: ai-igniter
            install_musl: false

          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: ai-igniter-aarch64-apple-darwin.tar.gz
            binary_name: ai-igniter

          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: ai-igniter-x86_64-apple-darwin.tar.gz
            binary_name: ai-igniter

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: ai-igniter-x86_64-pc-windows-msvc.zip
            binary_name: ai-igniter.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install musl-tools (Linux musl only)
        if: matrix.install_musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release assets (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf ${{ matrix.archive_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
          shasum -a 256 ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive_name }} | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii "${{ matrix.archive_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
