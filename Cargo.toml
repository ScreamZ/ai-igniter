[package]
name = "ai-igniter"
version = "1.1.0"
edition = "2024"
authors = ["ScreamZ"]
description = "Lightning-fast standalone workspace & service orchestrator for AI worktrees and parallel development"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ScreamZ/ai-igniter"
homepage = "https://github.com/ScreamZ/ai-igniter"
documentation = "https://github.com/ScreamZ/ai-igniter#readme"
keywords = ["worktree", "docker", "ai", "orchestrator", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/*", ".github/*"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
inquire = "0.9"
colored = "3.1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
ureq = { version = "3", default-features = false }
self_update = { version = "1.3.0", default-features = false, features = [
  "archive-tar",
  "archive-zip",
  "compression-tar-gz",
  "compression-zip-deflate",
  "github",
  "progress-bar",
  "rustls",
  "ureq",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
