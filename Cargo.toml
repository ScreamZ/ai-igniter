[package]
name = "ai-igniter"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
inquire = "0.9"
colored = "3.1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
